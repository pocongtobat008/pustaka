<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FAF5EE" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="e-FinTaxDoc — Platform terpadu Finance, Tax & Document: invoice, pajak, dokumen, AI document intelligence, dan entertainment expenses dalam satu platform." />
    <title>e-FinTaxDoc — Smart Finance, Tax & Document Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      /* ── Splash Screen e-FinTaxDoc (pre-React, tampil instan) ── */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background:
          radial-gradient(60% 50% at 20% 0%, rgba(67, 24, 255, 0.08), transparent 70%),
          radial-gradient(60% 50% at 85% 100%, rgba(6, 182, 212, 0.07), transparent 70%),
          #FAF5EE;
        font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
        transition: opacity .45s ease, visibility .45s ease;
      }
      #app-splash.env-dev {
        background:
          radial-gradient(60% 50% at 20% 0%, rgba(220, 38, 38, 0.10), transparent 70%),
          radial-gradient(60% 50% at 85% 100%, rgba(249, 115, 22, 0.08), transparent 70%),
          #FAF5EE;
      }
      html.dark #app-splash {
        background:
          radial-gradient(60% 50% at 20% 0%, rgba(99, 102, 241, 0.14), transparent 70%),
          radial-gradient(60% 50% at 85% 100%, rgba(6, 182, 212, 0.10), transparent 70%),
          #0a0a0a;
      }
      html.dark #app-splash.env-dev {
        background:
          radial-gradient(60% 50% at 20% 0%, rgba(220, 38, 38, 0.16), transparent 70%),
          radial-gradient(60% 50% at 85% 100%, rgba(249, 115, 22, 0.10), transparent 70%),
          #0a0a0a;
      }
      .splash-orb {
        width: 72px;
        height: 72px;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 55%, #06b6d4 100%);
        box-shadow: 0 10px 30px rgba(29, 78, 216, 0.40), inset 0 1px 0 rgba(255, 255, 255, 0.35);
        animation: splash-pop .55s cubic-bezier(.2, .9, .3, 1.4) both;
      }
      #app-splash.env-dev .splash-orb {
        background: linear-gradient(135deg, #ef4444 0%, #dc2626 55%, #f97316 100%);
        box-shadow: 0 10px 30px rgba(220, 38, 38, 0.45), inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }
      .splash-orb svg { animation: splash-float 2.2s ease-in-out infinite; }
      .splash-name {
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.03em;
        color: #1c1917;
        animation: splash-rise .5s ease .12s both;
      }
      .splash-name .accent { color: #4318FF; }
      html.dark .splash-name { color: #fafafa; }
      html.dark .splash-name .accent { color: #a5b4fc; }
      .splash-tagline {
        font-size: 11px;
        font-weight: 700;
        letter-spacing: .18em;
        text-transform: uppercase;
        color: #a8a29e;
        animation: splash-rise .5s ease .22s both;
      }
      .splash-dev-badge {
        display: none;
        padding: 3px 10px;
        border-radius: 999px;
        background: #ef4444;
        color: #fff;
        font-size: 9px;
        font-weight: 900;
        letter-spacing: .14em;
        text-transform: uppercase;
        animation: splash-rise .5s ease .28s both;
      }
      #app-splash.env-dev .splash-dev-badge { display: inline-block; }
      .splash-bar {
        width: 168px;
        height: 4px;
        margin-top: 6px;
        border-radius: 999px;
        background: rgba(28, 25, 23, 0.08);
        overflow: hidden;
      }
      html.dark .splash-bar { background: rgba(255, 255, 255, 0.08); }
      .splash-fill {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: linear-gradient(90deg, #4318FF, #06b6d4);
        transition: width .28s ease;
        position: relative;
        overflow: hidden;
      }
      #app-splash.env-dev .splash-fill { background: linear-gradient(90deg, #dc2626, #f97316); }
      .splash-fill::after {
        content: '';
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgba(255,255,255,.45), transparent);
        animation: splash-shimmer 1s ease-in-out infinite;
      }
      .splash-status {
        min-height: 14px;
        font-size: 10px;
        font-weight: 700;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: #a8a29e;
      }
      html.dark .splash-status { color: rgba(255,255,255,.35); }
      #app-splash.splash-hide { opacity: 0; visibility: hidden; pointer-events: none; }
      @keyframes splash-pop { from { opacity: 0; transform: scale(.7); } to { opacity: 1; transform: scale(1); } }
      @keyframes splash-float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
      @keyframes splash-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes splash-shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
      @media (prefers-reduced-motion: reduce) {
        .splash-orb, .splash-orb svg, .splash-name, .splash-tagline, .splash-dev-badge { animation: none; }
        .splash-fill::after { animation-duration: 2s; }
      }

      /* ── Layar error pre-React (module gagal dimuat/crash sebelum mount) ── */
      .boot-fatal {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        text-align: center;
        padding: 32px;
        max-width: 420px;
        color: #1c1917;
        font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif;
      }
      html.dark .boot-fatal { color: #fafafa; }
      .boot-fatal .boot-emoji { font-size: 40px; }
      .boot-fatal h1 { font-size: 18px; font-weight: 800; margin: 0; }
      .boot-fatal p { font-size: 13px; color: #78716c; margin: 0; max-width: 360px; }
      html.dark .boot-fatal p { color: rgba(255,255,255,.45); }
      .boot-fatal code {
        font-size: 11px;
        background: rgba(28,25,23,.06);
        border-radius: 8px;
        padding: 8px 12px;
        max-width: 380px;
        word-break: break-all;
        display: none;
        text-align: left;
        color: #b91c1c;
      }
      html.dark .boot-fatal code { background: rgba(255,255,255,.06); color: #fca5a5; }
      .boot-fatal code.visible { display: block; }
      .boot-fatal .boot-actions { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
      .boot-fatal button {
        padding: 10px 22px;
        border: none;
        border-radius: 12px;
        font-weight: 800;
        font-size: 13px;
        cursor: pointer;
        color: #fff;
        background: linear-gradient(135deg, #4318FF, #6366f1);
        box-shadow: 0 8px 20px rgba(67, 24, 255, 0.30);
        transition: transform .15s ease, filter .15s ease;
      }
      .boot-fatal button:hover { transform: translateY(-1px); filter: brightness(1.08); }
      .boot-fatal button.ghost {
        background: transparent;
        color: #4318FF;
        box-shadow: none;
        border: 1.5px solid rgba(67, 24, 255, .35);
      }
      html.dark .boot-fatal button.ghost { color: #a5b4fc; border-color: rgba(165, 180, 252, .4); }
      /* Dev environment: aksen merah */
      #app-splash.env-dev ~ .boot-fatal button,
      body.env-dev-marker .boot-fatal button { background: linear-gradient(135deg, #dc2626, #f97316); box-shadow: 0 8px 20px rgba(220,38,38,.35); }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <!-- Splash: digambar sebelum React mount; dihapus oleh main.jsx -->
    <div id="app-splash">
      <div class="splash-orb">
        <svg xmlns="http://www.w3.org/2000/svg" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="butt" stroke-linejoin="miter">
          <path d="M10 3v16M4.5 3H10M4.5 11H10M4.5 19H10M10 3h9.5M10 11h6M3.5 22.5h17"/>
        </svg>
      </div>
      <div class="splash-name">e-Fin<span class="accent">Tax</span>Doc</div>
      <div class="splash-tagline" id="splash-tagline">Akurat · Patuh · Terintegrasi</div>
      <div class="splash-dev-badge">Development</div>
      <div class="splash-bar"><div class="splash-fill" id="splash-fill"></div></div>
      <div class="splash-status" id="splash-status"></div>
    </div>

    <script>
      // ── Sinkron tema & DEV sejak awal (dipindah dari main.jsx agar splash
      //    dan layar error selalu tampil dengan tema benar walau module crash) ──
      (function () {
        try {
          var savedTheme = localStorage.getItem('archive_theme');
          if (savedTheme === 'dark' || (!savedTheme && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
          // Deteksi dev di inline script: dev server (port 5173/5174-preview dev)
          // dan hostname lokal. Prod bundle menimpa via flag jika perlu.
          var h = window.location.hostname;
          var isLocal = h === 'localhost' || h === '127.0.0.1' || h === '0.0.0.0';
          if (isLocal && (window.location.port === '5173' || window.location.port === '5175')) {
            var sp = document.getElementById('app-splash');
            if (sp) sp.classList.add('env-dev');
          }
        } catch (e) { /* ignore */ }

        // ── Guard pre-React: watchdog splash ──
        // Jika aplikasi tidak mengucapkan "saya hidup" dalam 20 detik (module gagal
        // dimuat / crash sebelum mount), tampilkan layar error dengan aksi perbaikan
        // — bukan splash yang berputar selamanya.
        var BOOT_TIMEOUT_MS = 20000;
        var booted = false;
        window.__APP_BOOTED__ = function () {
          booted = true;
        };
        window.__APP_IS_BOOTED__ = function () { return booted; };
        function showFatal(errText) {
          var sp = document.getElementById('app-splash');
          if (sp) sp.remove();
          var root = document.getElementById('root');
          var el = document.createElement('div');
          el.className = 'boot-fatal';
          var lang = 'id';
          try { lang = (localStorage.getItem('app-language') || 'id') === 'en' ? 'en' : 'id'; } catch (e) {}
          var t = lang === 'en'
            ? { title: 'Application failed to load', desc: 'An error occurred while starting e-FinTaxDoc. Try a hard reload; if it persists, clear the cached bundle. The error detail can be expanded for reporting.', retry: 'Hard Reload', clear: 'Clear Cache & Reload', detail: 'Show error detail' }
            : { title: 'Aplikasi gagal dimuat', desc: 'Terjadi error saat memulai e-FinTaxDoc. Coba muat ulang penuh; jika masih, bersihkan bundle cache. Detail error bisa dibuka untuk dilaporkan.', retry: 'Muat Ulang', clear: 'Bersihkan Cache & Muat', detail: 'Lihat detail error' };
          el.innerHTML =
            '<div class="boot-emoji">🛠️</div>' +
            '<h1>' + t.title + '</h1>' +
            '<p>' + t.desc + '</p>' +
            '<code id="boot-err-detail"></code>' +
            '<div class="boot-actions">' +
            '<button id="boot-retry">' + t.retry + '</button>' +
            '<button id="boot-clear" class="ghost">' + t.clear + '</button>' +
            '</div>';
          if (root && root.parentNode) root.parentNode.insertBefore(el, root);
          if (errText) {
            var code = el.querySelector('#boot-err-detail');
            if (code) code.textContent = String(errText).slice(0, 600);
          }
          el.querySelector('#boot-retry').addEventListener('click', function () {
            window.location.reload(true);
          });
          el.querySelector('#boot-clear').addEventListener('click', function () {
            try {
              if (window.caches && caches.keys) {
                caches.keys().then(function (keys) {
                  keys.forEach(function (k) { caches.delete(k); });
                  window.location.reload(true);
                });
              } else {
                window.location.reload(true);
              }
            } catch (e) { window.location.reload(true); }
          });
          el.querySelector('#boot-err-detail').addEventListener('click', function () {
            this.classList.toggle('visible');
          });
        }
        window.__BOOT_FATAL__ = showFatal;
        setTimeout(function () {
          if (!booted) {
            showFatal(null);
          }
        }, BOOT_TIMEOUT_MS);
      })();
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
